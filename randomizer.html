<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Randomizer</title>
<style>
  :root { --bg-color: rgb(0,0,0); --text-color: rgb(255,255,255); }
  html,body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:var(--bg-color); font-family:'Arial Black','Segoe UI',Arial,sans-serif; }
  .lamp-row { position:fixed; left:0; right:0; display:flex; justify-content:space-between; padding:0 1.2vw; box-sizing:border-box; z-index:5; pointer-events:none; }
  .lamp-row.top { top:1.2vh; }
  .lamp-row.bottom { bottom:1.2vh; }
  .lamp { width:1.6vw; height:1.6vw; min-width:10px; min-height:10px; border-radius:50%; background:#333; box-shadow:0 0 4px rgba(0,0,0,.6); animation:lampFlicker 1.1s infinite ease-in-out; }
  @keyframes lampFlicker { 0%,100% { opacity:.25; filter:brightness(0.6); } 50% { opacity:1; filter:brightness(1.6); } }
  .stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:3; }
  /* Полностью удален filter: blur со всех этапов */
  .number { font-size:42vw; line-height:1; font-weight:900; letter-spacing:-0.02em; color:var(--text-color); -webkit-text-stroke:0.4vw rgba(255,255,255,0.15); text-shadow: 0 0 2vw rgba(255,225,77,0.9), 0 0 6vw rgba(255,80,220,0.6), 0 0 10vw rgba(80,160,255,0.4); transform:scale(0.4); opacity:0; }
  .number.reveal { animation:popIn 0.65s cubic-bezier(.17,.89,.32,1.49) forwards; }
  @keyframes popIn { 0% { transform:scale(0.3) rotate(-6deg); opacity:0; } 60% { transform:scale(1.12) rotate(2deg); opacity:1; } 100% { transform:scale(1) rotate(0deg); opacity:1; } }
  .number.spin { animation:spinPulse 0.09s linear infinite; }
  @keyframes spinPulse { 0%,100% { transform:scale(1); opacity:.55; } 50% { transform:scale(1.03); opacity:1; } }
  .label { position:fixed; top:6vh; left:0; right:0; text-align:center; z-index:4; color:rgba(255,255,255,0.65); font-size:2.4vw; letter-spacing:0.5vw; text-transform:uppercase; font-weight:700; }
  canvas#fx { position:fixed; inset:0; z-index:6; pointer-events:none; }
  .flash { position:fixed; inset:0; background:#fff; opacity:0; z-index:7; pointer-events:none; }
  .flash.go { animation:flashOut 0.4s ease-out forwards; }
  @keyframes flashOut { 0% { opacity:0.9; } 100% { opacity:0; } }
</style>
</head>
<body>
  <div class="lamp-row top" id="lampsTop"></div>
  <div class="lamp-row bottom" id="lampsBottom"></div>
  <div class="label" id="rangeLabel"></div>
  <div class="stage"><div class="number" id="number">0</div></div>
  <canvas id="fx"></canvas>
  <div class="flash" id="flash"></div>

<script>
  const params = new URLSearchParams(window.location.search);
  function pick(p, f){ return (p !== null && p !== '' && !isNaN(p)) ? parseInt(p, 10) : f; }
  function pickBool(p, f){ return p !== null ? p !== '0' : f; }

  const rangeMin = pick(params.get('min'), 1);
  const rangeMax = pick(params.get('max'), 100);
  const spinDuration = pick(params.get('spin'), 900);
  const SHOW_CONFETTI = pickBool(params.get('confetti'), true);
  const SHOW_LAMPS = pickBool(params.get('lamps'), true);
  const SHOW_LABEL = pickBool(params.get('label'), true);
  const SEED = params.get('seed');

  function parseDotsToRgb(str) {
    if (!str) return null;
    const p = str.split('.');
    if (p.length === 3) {
      const r = parseInt(p[0], 10), g = parseInt(p[1], 10), b = parseInt(p[2], 10);
      if (!isNaN(r) && !isNaN(g) && !isNaN(b)) return `rgb(${r}, ${g}, ${b})`;
    }
    return null;
  }

  if (params.has('bg')) {
    const bg = parseDotsToRgb(params.get('bg'));
    if (bg) document.documentElement.style.setProperty('--bg-color', bg);
  }
  if (params.has('color')) {
    const col = parseDotsToRgb(params.get('color'));
    if (col) document.documentElement.style.setProperty('--text-color', col);
  }

  function randomInRange(lo, hi){ return Math.floor(Math.random() * (hi - lo + 1)) + lo; }

  let finalNumber = 0;
  if (SEED !== null && SEED !== '' && !isNaN(SEED) && parseInt(SEED, 10) !== -1) {
    finalNumber = parseInt(SEED, 10);
  } else {
    const allNumbers = [];
    for (let i = rangeMin; i <= rangeMax; i++) { allNumbers.push(i); }
    const historyKey = `fs_gh_history_${rangeMin}_${rangeMax}`;
    let used = [];
    try {
      const h = localStorage.getItem(historyKey);
      if (h) used = JSON.parse(h);
    } catch(e){}
    let available = allNumbers.filter(n => !used.includes(n));
    if (available.length === 0) {
      let last = used.length > 0 ? used[used.length - 1] : null;
      used = [];
      available = allNumbers.filter(n => n !== last);
      if (available.length === 0) available = [...allNumbers];
    }
    finalNumber = available[Math.floor(Math.random() * available.length)];
    used.push(finalNumber);
    try { localStorage.setItem(historyKey, JSON.stringify(used)); } catch(e){}
  }

  const numberEl = document.getElementById('number');
  if (SHOW_LABEL) { document.getElementById('rangeLabel').textContent = rangeMin + ' – ' + rangeMax; }

  function buildLamps(){
    if (!SHOW_LAMPS) return;
    const top = document.getElementById('lampsTop'), bottom = document.getElementById('lampsBottom');
    const colors = ['#ff4d6d','#ffe14d','#4dd0ff','#8cff4d','#ff8c4d','#c04dff'];
    for (let i = 0; i < 26; i++){
      const c = colors[i % colors.length], lampT = document.createElement('div');
      lampT.className = 'lamp'; lampT.style.background = c; lampT.style.boxShadow = `0 0 1.4vw ${c}`;
      lampT.style.animationDelay = (Math.random() * 1.1).toFixed(2) + 's';
      top.appendChild(lampT);
      const lampB = lampT.cloneNode();
      lampB.style.animationDelay = (Math.random() * 1.1).toFixed(2) + 's';
      bottom.appendChild(lampB);
    }
  }

  function runNumberSequence(){
    numberEl.classList.add('spin');
    const spinInterval = setInterval(() => { numberEl.textContent = randomInRange(rangeMin, rangeMax); }, 45);
    setTimeout(() => {
      clearInterval(spinInterval);
      numberEl.classList.remove('spin');
      numberEl.textContent = finalNumber;
      numberEl.classList.add('reveal');
      document.getElementById('flash').classList.add('go');
      if (SHOW_CONFETTI) triggerConfetti();
    }, spinDuration);
  }

  function triggerConfetti() {
    const canvas = document.getElementById('fx'), ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    let pt = [];
    const colors = ['#ff4d6d', '#ffe14d', '#4dd0ff', '#8cff4d', '#ff8c4d', '#c04dff'];
    /* Конфетти генерируются сверху экрана и летят вниз */
    for (let i = 0; i < 140; i++) {
      pt.push({ x: Math.random() * canvas.width, y: Math.random() * -canvas.height - 20, vx: (Math.random() - 0.5) * 4, vy: Math.random() * 5 + 4, size: Math.random() * 7 + 5, color: colors[Math.floor(Math.random() * colors.length)], rotation: Math.random() * Math.PI, rSpeed: (Math.random() - 0.5) * 0.1 });
    }
    function update() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      let alive = false;
      pt.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.rotation += p.rSpeed;
        if (p.y < canvas.height + 20) alive = true;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rotation); ctx.fillStyle = p.color; ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size); ctx.restore();
      });
      if (alive) requestAnimationFrame(update);
      else ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
    update();
  }

  window.addEventListener('DOMContentLoaded', () => { buildLamps(); runNumberSequence(); });
</script>
</body>
</html>
